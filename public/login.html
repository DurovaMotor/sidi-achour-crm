<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#000000">
    <meta name="robots" content="noindex, noarchive">
    <title>Sidi Achour | Adam 登录</title>
    <link rel="icon" href="/media/brand/sidi-achour-logo.f8ca917c1cb1c72a.png" type="image/png">
    <style>
      :root {
        color-scheme: light;
        font-family: "Microsoft YaHei UI", "Microsoft YaHei", "Segoe UI", sans-serif;
        font-synthesis: none;
      }
      * { box-sizing: border-box; }
      body {
        min-height: 100dvh;
        margin: 0;
        display: grid;
        place-items: center;
        padding: 24px;
        background:
          radial-gradient(circle at 28% 18%, rgba(255, 255, 255, .96) 0 12%, transparent 38%),
          linear-gradient(135deg, #f7f7f7 0 42%, #9b0d06 72%, #190000 88%, #000 100%);
        color: #1a1a1a;
      }
      .login-shell {
        width: min(100%, 440px);
        border-top: 5px solid #d42a1d;
        background: #fff;
        box-shadow: 0 28px 80px rgba(0, 0, 0, .35);
      }
      .brand {
        min-height: 144px;
        display: grid;
        place-items: center;
        padding: 22px;
        border-bottom: 1px solid #ccc;
        background: linear-gradient(180deg, #fff, #f7f7f7);
      }
      .brand img {
        width: 108px;
        height: 108px;
        object-fit: contain;
        user-select: none;
        -webkit-user-drag: none;
      }
      .login-content { padding: 30px; }
      h1 { margin: 0; font-size: 25px; line-height: 1.25; }
      .intro { margin: 8px 0 24px; color: #6b6b6b; font-size: 14px; }
      form { display: grid; gap: 18px; }
      label { display: grid; gap: 7px; font-size: 14px; font-weight: 700; }
      input {
        width: 100%;
        height: 48px;
        padding: 0 13px;
        border: 2px solid #5e5e5e;
        border-radius: 2px;
        background: #fff;
        color: #000;
        font: inherit;
        outline: none;
      }
      input:focus { border-color: #d42a1d; box-shadow: 0 0 0 2px rgba(212, 42, 29, .16); }
      button {
        min-height: 50px;
        border: 2px solid #000;
        border-radius: 2px;
        background: #000;
        color: #fff;
        font: inherit;
        font-weight: 700;
        cursor: pointer;
      }
      button:hover, button:focus-visible { background: #d42a1d; border-color: #d42a1d; }
      button:disabled { cursor: wait; opacity: .65; }
      .message { min-height: 24px; margin: 0; color: #a91d14; font-size: 14px; font-weight: 700; }
      .back { display: block; margin-top: 20px; color: #5e5e5e; font-size: 13px; text-align: center; }
      @media (max-width: 520px) {
        body { padding: 0; background: #fff; }
        .login-shell { min-height: 100dvh; border-top-width: 4px; box-shadow: none; }
        .login-content { padding: 28px 22px; }
      }
    </style>
  </head>
  <body>
    <main class="login-shell">
      <div class="brand">
        <img src="/media/brand/sidi-achour-logo.f8ca917c1cb1c72a.png" alt="Sidi Achour" width="1254" height="1254">
      </div>
      <section class="login-content" aria-labelledby="loginTitle">
        <h1 id="loginTitle">Adam 登录</h1>
        <p class="intro">请输入账号和密码进入中文管理页面。</p>
        <form id="loginForm">
          <label>
            账号名称
            <input id="username" name="username" type="text" autocomplete="username" autocapitalize="none" required autofocus>
          </label>
          <label>
            账号密码
            <input id="password" name="password" type="password" autocomplete="current-password" required>
          </label>
          <p class="message" id="message" role="alert" aria-live="polite"></p>
          <button id="submitButton" type="submit">登录</button>
        </form>
        <a class="back" href="/">返回客户页面</a>
      </section>
    </main>
    <script>
      const form = document.querySelector("#loginForm");
      const message = document.querySelector("#message");
      const submitButton = document.querySelector("#submitButton");

      document.addEventListener("contextmenu", (event) => event.preventDefault(), true);
      document.addEventListener("dragstart", (event) => {
        if (event.target.closest("img")) event.preventDefault();
      }, true);
      document.addEventListener("keydown", (event) => {
        if ((event.ctrlKey || event.metaKey) && ["s", "p"].includes(event.key.toLowerCase())) {
          event.preventDefault();
          event.stopPropagation();
        }
      }, true);

      form.addEventListener("submit", async (event) => {
        event.preventDefault();
        message.textContent = "";
        submitButton.disabled = true;
        submitButton.textContent = "正在登录…";

        try {
          const response = await fetch("/api/auth/login", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              username: form.elements.username.value,
              password: form.elements.password.value,
            }),
          });
          const result = await response.json();
          if (!response.ok) throw new Error(result.error || "登录失败");
          window.location.replace("/Adam");
        } catch (error) {
          message.textContent = error.message;
          submitButton.disabled = false;
          submitButton.textContent = "登录";
          form.elements.password.select();
        }
      });
    </script>
  </body>
</html>
